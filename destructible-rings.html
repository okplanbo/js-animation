<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js Rings with Destructible Sections</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; overflow: hidden; background: #000; }
        canvas { display: block; }

        #controls {
            position: fixed;
            top: 16px;
            right: 16px;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 10px;
            padding: 14px 16px;
            color: #fff;
            font-family: 'Courier New', monospace;
            font-size: 11px;
            letter-spacing: 0.08em;
            width: 180px;
            user-select: none;
            z-index: 10;
        }

        #controls h3 {
            margin: 0 0 12px 0;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: rgba(255,255,255,0.4);
            font-weight: normal;
        }

        .control-row {
            margin-bottom: 12px;
        }

        .control-row:last-child {
            margin-bottom: 0;
        }

        .control-label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 5px;
            color: rgba(255,255,255,0.8);
        }

        .control-value {
            color: #90EE90;
            font-weight: bold;
            min-width: 28px;
            text-align: right;
        }

        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 2px;
            background: rgba(255,255,255,0.2);
            border-radius: 2px;
            outline: none;
            cursor: pointer;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #90EE90;
            cursor: pointer;
            transition: transform 0.1s;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.3);
        }

        input[type="range"]::-moz-range-thumb {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #90EE90;
            cursor: pointer;
            border: none;
        }

        .divider {
            height: 1px;
            background: rgba(255,255,255,0.1);
            margin: 12px 0;
        }

        .hint {
            font-size: 9px;
            color: rgba(255,255,255,0.25);
            text-align: center;
            margin-top: 10px;
        }

        #restart-btn {
            width: 100%;
            padding: 6px;
            background: rgba(144,238,144,0.1);
            border: 1px solid rgba(144,238,144,0.3);
            border-radius: 5px;
            color: #90EE90;
            font-family: 'Courier New', monospace;
            font-size: 10px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            cursor: pointer;
            margin-top: 12px;
            transition: background 0.2s, border-color 0.2s;
        }

        #restart-btn:hover {
            background: rgba(144,238,144,0.2);
            border-color: rgba(144,238,144,0.6);
        }
    </style>
</head>
<body>

<div id="controls">
    <h3>Controls</h3>

    <div class="control-row">
        <div class="control-label">
            <span>Speed</span>
            <span class="control-value" id="speed-val">1×</span>
        </div>
        <input type="range" id="speed-slider" min="1" max="4" step="0.5" value="1">
    </div>

    <div class="control-row">
        <div class="control-label">
            <span>Start balls</span>
            <span class="control-value" id="balls-val">2</span>
        </div>
        <input type="range" id="balls-slider" min="1" max="5" step="1" value="2">
    </div>

    <button id="restart-btn">↺ Restart</button>
    <div class="hint">Space to pause</div>
</div>

<script type="importmap">
  {
    "imports": {
      "three": "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.164.1/three.module.min.js"
    }
  }
</script>
<script type="module">
    import * as THREE from 'three';

    // ── Config (driven by sliders) ──────────────────────────────────────────
    let BASE_SPEED    = 4;      // base px/frame (multiplier applied on top)
    let speedMult     = 1;
    let initialBalls  = 2;

    // ── Slider wiring ───────────────────────────────────────────────────────
    const speedSlider = document.getElementById('speed-slider');
    const ballsSlider = document.getElementById('balls-slider');
    const speedVal    = document.getElementById('speed-val');
    const ballsVal    = document.getElementById('balls-val');

    speedSlider.addEventListener('input', () => {
        speedMult = parseFloat(speedSlider.value);
        speedVal.textContent = speedMult + '×';
        balls.forEach(b => { b.userData.speed = BASE_SPEED * speedMult; });
    });

    ballsSlider.addEventListener('input', () => {
        initialBalls = parseInt(ballsSlider.value);
        ballsVal.textContent = initialBalls;
    });

    document.getElementById('restart-btn').addEventListener('click', restartGame);

    // ── Renderer & scene ────────────────────────────────────────────────────
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x000000);

    const W = window.innerWidth;
    const H = window.innerHeight;

    const camera = new THREE.OrthographicCamera(W / -2, W / 2, H / 2, H / -2, 1, 1000);
    camera.position.z = 5;

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(W, H);
    renderer.setPixelRatio(window.devicePixelRatio);   // crisp on HiDPI screens
    document.body.appendChild(renderer.domElement);

    // ── Ring geometry constants ─────────────────────────────────────────────
    const shortestSide      = Math.min(W, H);
    const largestOuterRadius = (shortestSide * 0.8) / 2;
    const ballRadius         = 10;
    const sectionCount       = Math.floor(2 * Math.PI * largestOuterRadius / (ballRadius * 2));
    const sectionThickness   = 0.025 * largestOuterRadius;
    const RING_COUNT         = 4;

    // ── State ───────────────────────────────────────────────────────────────
    let ringSections     = [];
    let balls            = [];
    let currentRingIndex = RING_COUNT - 1;
    let isPaused         = false;

    // ── Ring helpers ────────────────────────────────────────────────────────
    function createRingSection(innerRadius, outerRadius, startAngle, angle) {
        // Use more radial segments for smoother arc edges
        const segments = Math.max(8, Math.ceil(angle / (Math.PI / 60)));
        const geometry = new THREE.RingGeometry(innerRadius, outerRadius, segments, 1, startAngle, angle);
        const material = new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide });
        const section  = new THREE.Mesh(geometry, material);
        section.userData = { innerRadius, outerRadius, startAngle, angle };
        return section;
    }

    function buildRings() {
        const sectionAngle = (2 * Math.PI) / sectionCount;
        for (let i = 0; i < RING_COUNT; i++) {
            const outerRadius = largestOuterRadius * (1 - i * 0.2);
            const innerRadius = outerRadius - sectionThickness;
            for (let j = 0; j < sectionCount; j++) {
                const section = createRingSection(innerRadius, outerRadius, sectionAngle * j, sectionAngle);
                section.position.set(0, 0, 0);
                section.userData.ringIndex = i;
                ringSections.push(section);
                scene.add(section);
            }
        }
    }

    // ── Ball helpers ────────────────────────────────────────────────────────
    const ballMaterial = new THREE.MeshBasicMaterial({ color: 0x90EE90 });

    function createBall(existingBalls = []) {
        const geo  = new THREE.CircleGeometry(ballRadius, 48);   // 48 segs → smooth circle
        const ball = new THREE.Mesh(geo, ballMaterial);

        let pos;
        let attempts = 0;
        do {
            pos = new THREE.Vector2(Math.random() * 40 - 20, Math.random() * 40 - 20);
            attempts++;
        } while (
            attempts < 50 &&
            existingBalls.some(b =>
                pos.distanceTo(new THREE.Vector2(b.position.x, b.position.y)) < ballRadius * 4
            )
        );

        ball.position.set(pos.x, pos.y, 0);
        ball.userData = {
            direction: new THREE.Vector2(Math.random() * 2 - 1, Math.random() * 2 - 1).normalize(),
            speed:     BASE_SPEED * speedMult
        };
        scene.add(ball);
        return ball;
    }

    // ── Collision helpers ───────────────────────────────────────────────────
    function areAllSectionsDestroyed(ringIndex) {
        return ringSections.every(s => s.userData.ringIndex !== ringIndex);
    }

    function checkCollisions() {
        balls.forEach(ball => {
            const ballPos  = new THREE.Vector2(ball.position.x, ball.position.y);
            const dist     = ballPos.length();
            const angleToB = Math.atan2(ballPos.y, ballPos.x);
            const angleNorm = (angleToB + 2 * Math.PI) % (2 * Math.PI);

            for (let i = ringSections.length - 1; i >= 0; i--) {
                const section = ringSections[i];
                const { innerRadius, outerRadius, startAngle, angle, ringIndex } = section.userData;

                if (
                    dist + ballRadius >= innerRadius &&
                    dist - ballRadius <= outerRadius &&
                    angleNorm >= startAngle &&
                    angleNorm <= startAngle + angle
                ) {
                    const normal = new THREE.Vector2(Math.cos(angleToB), Math.sin(angleToB));
                    const dot    = ball.userData.direction.dot(normal);
                    ball.userData.direction.sub(normal.clone().multiplyScalar(2 * dot)).normalize();
                    ball.userData.direction.x += (Math.random() - 0.5) * 0.1;
                    ball.userData.direction.y += (Math.random() - 0.5) * 0.1;
                    ball.userData.direction.normalize();

                    if (ringIndex === currentRingIndex) {
                        scene.remove(section);
                        ringSections.splice(i, 1);
                    }
                    break;
                }
            }
        });

        if (areAllSectionsDestroyed(currentRingIndex)) {
            currentRingIndex--;
            balls.push(createBall(balls));
        }
    }

    function checkBallCollisions() {
        for (let i = 0; i < balls.length; i++) {
            for (let j = i + 1; j < balls.length; j++) {
                const b1  = balls[i], b2 = balls[j];
                const p1  = new THREE.Vector2(b1.position.x, b1.position.y);
                const p2  = new THREE.Vector2(b2.position.x, b2.position.y);
                if (p1.distanceTo(p2) <= ballRadius * 2) {
                    const d1 = b1.userData.direction.clone();
                    b1.userData.direction.copy(b2.userData.direction).normalize();
                    b2.userData.direction.copy(d1).normalize();
                }
            }
        }
    }

    // ── Game init / restart ─────────────────────────────────────────────────
    function clearScene() {
        ringSections.forEach(s => scene.remove(s));
        ringSections = [];
        balls.forEach(b => scene.remove(b));
        balls = [];
    }

    function restartGame() {
        clearScene();
        currentRingIndex = RING_COUNT - 1;
        buildRings();
        for (let i = 0; i < initialBalls; i++) {
            balls.push(createBall(balls));
        }
    }

    restartGame();

    // ── Keyboard ────────────────────────────────────────────────────────────
    window.addEventListener('keydown', e => {
        if (e.code === 'Space') { e.preventDefault(); isPaused = !isPaused; }
    });

    // ── Render loop ─────────────────────────────────────────────────────────
    let lastFrameTime = 0;
    const frameDuration = 1000 / 60;

    function animate(timestamp) {
        requestAnimationFrame(animate);
        if (isPaused) return;
        if (timestamp - lastFrameTime < frameDuration) return;
        lastFrameTime = timestamp;

        balls.forEach(ball => {
            ball.position.x += ball.userData.speed * ball.userData.direction.x;
            ball.position.y += ball.userData.speed * ball.userData.direction.y;
        });

        checkCollisions();
        checkBallCollisions();

        balls.forEach(ball => {
            if (ball.position.x - ballRadius < W / -2 || ball.position.x + ballRadius > W / 2)
                ball.userData.direction.x *= -1;
            if (ball.position.y - ballRadius < H / -2 || ball.position.y + ballRadius > H / 2)
                ball.userData.direction.y *= -1;
        });

        renderer.render(scene, camera);
    }
    animate();
</script>
</body>
</html>
